    var pct = live ? Math.round(100 * c.done / live) : 0;
    var order = ["done", "doing", "pause", "pending", "cancel"];
    $("wm-sum").innerHTML =
      '<div class="pct">' + pct + "%<small>" + esc(fmt(L.done_of, { done: c.done, live: live })) + (c.cancel ? esc(fmt(L.cancelled, { n: c.cancel })) : "") + "</small></div>" +
      '<div class="bar" role="img" aria-label="' + esc(fmt(L.pct_done, { pct: pct })) + '">' + order.map(function (s) { return c[s] ? '<span class="seg ' + s + '" style="flex-grow:' + c[s] + '"></span>' : ""; }).join("") + "</div>" +
      '<div class="nums">' + order.map(function (s) { return '<span class="it">' + sw(s) + "<b>" + c[s] + "</b> " + esc(L.st[s].toLowerCase()) + "</span>"; }).join("") + "</div>";
  })();

  // Legend
  $("wm-legend").innerHTML = Object.keys(L.st).map(function (s) { return '<span class="it">' + sw(s) + esc(L.st[s]) + "</span>"; }).join("");

  // Children currently visible under a node (plus the virtual "+N" / "fewer" button).
  function visibleKids(n) {
    if (!n.open || !n.kids.length) return [];
    var shown = n.showAll ? n.kids.slice() : n.kids.slice(0, MAX_SHOWN);
    if (n.kids.length > MAX_SHOWN) shown.push({ more: true, owner: n, id: n.id + "-more", depth: n.depth + 1, kids: [] });
    return shown;
  }

  var els = {}, prevIds = {};
  function render() {
    var seen = {};
    // 1) create or update an element for every visible node
    (function walk(n) {
      seen[n.id] = true;
      var el = els[n.id];
      if (!el) {
        el = document.createElement(n.more ? "button" : (n.kids.length ? "button" : "div"));
        if (el.tagName === "BUTTON") el.type = "button";
        el.dataset.id = n.id; el.dataset.depth = n.depth; canvas.appendChild(el); els[n.id] = el;
        if (prevIds.__init) el.classList.add("fresh");
      }
      var fresh = el.classList.contains("fresh") ? " fresh" : "";
      if (n.more) {
        var hidden = n.owner.kids.length - MAX_SHOWN;
        el.className = "wm-node wm-more" + (n.depth >= 3 ? " lvl-deep" : "") + fresh;
        el.innerHTML = '<span class="txt">' + esc(n.owner.showAll ? L.less : fmt(L.more, { n: hidden })) + "</span>";
        el.setAttribute("aria-label", fmt(n.owner.showAll ? L.less_aria : L.more_aria, { n: n.owner.showAll ? MAX_SHOWN : hidden, name: n.owner.name }));
      } else {
        var lvl = n.level || "task";
        el.className = "wm-node lvl-" + lvl + " st-" + n.status + (n.kids.length ? " has-kids" : "") + fresh;
        var code = n.code || "";   // stable id assigned by scripts/workmap.py (1, P1, T1, B1)
        var head = code ? (ICONS[n.status] || "") + '<span class="wm-num">' + esc(code) + "</span>" : "";
        var count = n.kids.length && !n.open ? ' <span class="wm-count">' + countAll(n) + "</span>" : "";
        el.innerHTML = head + '<span class="txt">' + esc(n.name) + "</span>" + count;
        el.title = (L.lvl[lvl] ? L.lvl[lvl] + (code ? " " + code : "") + " · " : "") + L.st[n.status] + (n.owner ? " · " + n.owner : "") + (n.ref ? " · " + n.ref : "") + (n.at ? " · " + n.at : "") + (n.note ? "\n" + n.note : "");
        if (n.kids.length) el.setAttribute("aria-expanded", String(n.open));
        if (n.owner) {   // owner tag: a separate element, positioned under the node's right corner after layout
          var ow = els[n.id + "-own"];
          if (!ow) { ow = document.createElement("div"); ow.className = "wm-owner"; canvas.appendChild(ow); els[n.id + "-own"] = ow; }
          ow.textContent = n.owner; ow.title = n.owner; seen[n.id + "-own"] = true;
        }
      }
      visibleKids(n).forEach(walk);
    })(DATA);
    Object.keys(els).forEach(function (id) { if (!seen[id]) { els[id].remove(); delete els[id]; } });
    // 2) measure and lay out: one column per depth, every chip in a column as wide as the widest one, generous gaps
    var colW = [], GAP = [140, 130, 120, 110], VG = { 1: 30, 2: 22, 3: 18, 4: 16 }, PAD = 24;   // horizontal gap between columns, vertical gap per depth
    Object.keys(els).forEach(function (id) { els[id].style.width = ""; });   // measure natural widths first
    (function cols(n) { colW[n.depth] = Math.max(colW[n.depth] || 0, Math.ceil(els[n.id].getBoundingClientRect().width)); visibleKids(n).forEach(cols); })(DATA);   // ceil: a rounded-down width would clip the text
    Object.keys(els).forEach(function (id) { var d = +els[id].dataset.depth; if (d > 0) els[id].style.width = colW[d] + "px"; });
    function size(n) { var el = els[n.id]; return { w: el.offsetWidth, h: el.offsetHeight }; }
    var colX = [PAD]; for (var d = 1; d < colW.length; d++) colX[d] = colX[d - 1] + colW[d - 1] + (GAP[d - 1] || 110);
    var OWN_GAP = 3;   // space between a node and its owner tag
    function tagH(n) { var ow = els[n.id + "-own"]; return ow ? ow.offsetHeight + OWN_GAP : 0; }
    var cursor = PAD, pos = {};
    (function place(n) {
      var s = size(n), kids = visibleKids(n), extra = tagH(n);
      if (!kids.length) { pos[n.id] = { x: colX[n.depth], y: cursor, w: s.w, h: s.h }; cursor += s.h + extra + (VG[n.depth] || 10); return; }
      kids.forEach(place);
      var a = pos[kids[0].id], b = pos[kids[kids.length - 1].id];
      var mid = (a.y + a.h / 2 + b.y + b.h / 2) / 2;
      var y = Math.max(mid - s.h / 2, n.depth ? 0 : PAD);
      pos[n.id] = { x: colX[n.depth], y: y, w: s.w, h: s.h };
      if (y + s.h + extra > cursor) cursor = y + s.h + extra + (VG[n.depth] || 10);
    })(DATA);
    var W = 0, H = 0;
    Object.keys(pos).forEach(function (id) {
      var p = pos[id], el = els[id], ow = els[id + "-own"];
      el.style.left = p.x + "px"; el.style.top = p.y + "px"; W = Math.max(W, p.x + p.w); H = Math.max(H, p.y + p.h);
      if (ow) { ow.style.left = Math.max(p.x, p.x + p.w - ow.offsetWidth) + "px"; ow.style.top = (p.y + p.h + OWN_GAP) + "px"; H = Math.max(H, p.y + p.h + OWN_GAP + ow.offsetHeight); }
    });
    canvas.style.width = (W + PAD) + "px"; canvas.style.height = (H + PAD) + "px";
    links.setAttribute("width", W + PAD); links.setAttribute("height", H + PAD);
    // 3) connectors: right-angle elbows with a small radius, one thin colour; they stop LINK_GAP px short of both nodes
    var out = [], R = 6, LINK_GAP = 10;
    (function draw(n) {
      var p = pos[n.id];
      visibleKids(n).forEach(function (k) {
        var c = pos[k.id];
        var px = p.x + p.w + LINK_GAP, py = p.y + p.h / 2;
        var cx = c.x - LINK_GAP, cy = c.y + c.h / 2, mx = c.x - (GAP[k.depth - 1] || 110) / 2;
        var dy = cy - py, s = dy < 0 ? -1 : 1, r = Math.max(0, Math.min(R, Math.abs(dy) / 2, mx - px, cx - mx)), d;
        if (Math.abs(dy) < 1) d = "M" + px + " " + py + " H" + cx;
        else d = "M" + px + " " + py + " H" + (mx - r) + " Q" + mx + " " + py + " " + mx + " " + (py + s * r) + " V" + (cy - s * r) + " Q" + mx + " " + cy + " " + (mx + r) + " " + cy + " H" + cx;
        out.push('<path d="' + d + '" fill="none" stroke="var(--wm-line)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"' + (k.more ? ' stroke-dasharray="3 3"' : "") + "/>");
        draw(k);
      });
    })(DATA);
    links.innerHTML = out.join("");
    prevIds.__init = true;
  }

  canvas.addEventListener("click", function (e) {
    var el = e.target.closest(".wm-node"); if (!el) return;
    var id = el.dataset.id;
    if (/-more$/.test(id)) { var owner = nodes.filter(function (n) { return n.id === id.replace(/-more$/, ""); })[0]; owner.showAll = !owner.showAll; render(); return; }
    var n = nodes.filter(function (x) { return x.id === id; })[0];
    if (n && n.kids.length && n.depth > 0) { n.open = !n.open; render(); els[id] && els[id].focus(); }
  });
  $("wm-open").addEventListener("click", function () { nodes.forEach(function (n) { n.open = true; n.showAll = true; }); render(); });
  $("wm-fold").addEventListener("click", function () { nodes.forEach(function (n) { n.open = n.depth < 1; n.showAll = false; }); render(); });
  // Full screen: only the map card. Hidden where the browser does not allow it (some embedded viewers).
  var card = $("wm-card"), fullBtn = $("wm-full");
  function fullLabel() { fullBtn.textContent = document.fullscreenElement === card ? L.unfull : L.full; }
  fullBtn.addEventListener("click", function () {
    if (document.fullscreenElement) { if (document.exitFullscreen) document.exitFullscreen(); return; }
    if (card.requestFullscreen) { var p = card.requestFullscreen(); if (p && p.catch) p.catch(function () {}); }
  });
  document.addEventListener("fullscreenchange", function () { fullLabel(); render(); });
  if (!document.fullscreenEnabled || !card.requestFullscreen) fullBtn.hidden = true;
  fullLabel();
  // Light / dark: one choice for every page in docs/ (the workdocs pages read and write the same localStorage key)
  var themeBtn = $("wm-theme"), rootEl = document.documentElement;
  themeBtn.setAttribute("aria-label", L.theme); themeBtn.title = L.theme;
  function isDark() { var t = rootEl.getAttribute("data-theme"); if (t) return t === "dark"; return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }
  themeBtn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    rootEl.setAttribute("data-theme", next);
    try { localStorage.setItem("docs-theme", next); } catch (e) { /* file:// or blocked storage: the choice lasts for this page */ }
  });
  var navIn = document.querySelector(".topnav .in");
  if (navIn) { themeBtn.className = "theme"; navIn.appendChild(themeBtn); }
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render); // re-measure once fonts are in
  window.addEventListener("resize", function () { clearTimeout(window.__wmT); window.__wmT = setTimeout(render, 150); });
})();
</script>
</body>
