# Public hosted demo = zero-key demo mode only.
# The app has no user authentication and keeps invoices / pending actions in
# one process's memory, so it refuses PayPal and LLM credentials when it detects
# a hosted platform (RENDER / VERCEL env). Run live sandbox mode locally only.
services:
  - type: web
    name: paypal-invoice-copilot
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci && npm run build
    # PUBLIC_DEMO=true makes scripts/serve.sh bind 0.0.0.0 (Render needs that);
    # it refuses to start unless DEMO_MODE=true, and the app ignores credentials.
    startCommand: npm run start
    envVars:
      - key: PUBLIC_DEMO
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: FORCE_DEMO_AGENT
        value: "true"
      - key: NODE_VERSION
        value: "20"
